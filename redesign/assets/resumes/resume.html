<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Résumé | Andrew Zambazos</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/images/AZ.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../style.css" />
    <style>
      @media print {
        #header, #particle-canvas, footer, .no-print { display: none !important; }
        main { padding-top: 0 !important; }
      }
    </style>
  </head>
  <body class="antialiased">
    <canvas id="particle-canvas"></canvas>

    <header id="header" class="glass-effect fixed top-0 left-0 right-0 z-50 transition-all duration-300">
      <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <a href="#home" class="text-2xl font-bold tracking-wider">AZ</a>
        <nav class="hidden md:flex space-x-8 items-center">
          <a href="#about" class="hover:text-[#00D4FF] transition-colors duration-300">About</a>
          <a href="../../projects.html" class="hover:text-[#00D4FF] transition-colors duration-300">Projects</a>
          <a href="#resume" class="hover:text-[#00D4FF] transition-colors duration-300">Résumé</a>
          <a href="#contact" class="bg-violet-600 hover:bg-violet-500 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300">Contact</a>
        </nav>
        <button id="mobile-menu-button" class="md:hidden text-2xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
      <div id="mobile-menu" class="hidden md:hidden px-6 pb-4">
        <a href="#about" class="block py-2 hover:text-[#00D4FF]">About</a>
        <a href="../../projects.html" class="block py-2 hover:text-[#00D4FF]">Projects</a>
  <a href="#resume" class="block py-2 hover:text-[#00D4FF]">Résumé</a>
        <a href="#contact" class="block mt-2 text-center bg-violet-600 hover:bg-violet-500 text-white font-bold py-2 px-4 rounded-lg">Contact</a>
      </div>
    </header>

    <main class="pt-28 pb-16">
      <section id="resume" class="container mx-auto px-6">
        <div id="resume-content" class="space-y-6" aria-live="polite">
          <p class="text-gray-400">Loading résumé…</p>
        </div>
      </section>
    </main>

    <footer class="py-8 border-t border-gray-800">
      <div class="container mx-auto px-6 text-center text-gray-500">
        <p>&copy; 2025 Andrew Zambazos. All Rights Reserved.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", async () => {
        const container = document.getElementById("resume-content");
        try {
          const response = await fetch("./resume.md", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Failed to load résumé (${response.status})`);
          }
          const markdown = await response.text();
          container.innerHTML = marked.parse(markdown);

          const nodes = Array.from(container.childNodes).filter((node) => {
            if (node.nodeType === Node.TEXT_NODE) {
              return node.textContent.trim().length > 0;
            }
            return true;
          });

          container.innerHTML = "";
          const fragment = document.createDocumentFragment();
          let index = 0;

          const headerWrapper = document.createElement("div");
          headerWrapper.className = "resume-header";
          while (index < nodes.length) {
            const node = nodes[index];
            if (node.nodeType === Node.ELEMENT_NODE && (node.tagName === "H2" || node.tagName === "HR")) {
              break;
            }
            headerWrapper.appendChild(node);
            index += 1;
          }
          if (headerWrapper.childNodes.length) {
            fragment.appendChild(headerWrapper);
          }

          while (index < nodes.length) {
            const node = nodes[index];
            if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "HR") {
              index += 1;
              const footerWrapper = document.createElement("div");
              footerWrapper.className = "resume-footer";
              while (index < nodes.length) {
                footerWrapper.appendChild(nodes[index]);
                index += 1;
              }
              const actionList = footerWrapper.querySelector("ul");
              if (actionList) {
                actionList.classList.add("resume-actions", "no-print");
              }
              if (footerWrapper.childNodes.length) {
                fragment.appendChild(footerWrapper);
              }
              break;
            }

            if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "H2") {
              const section = document.createElement("section");
              section.className = "resume-section glass-effect rounded-2xl p-6 md:p-8 border border-gray-800";
              section.appendChild(node);
              index += 1;
              while (index < nodes.length) {
                const next = nodes[index];
                if (next.nodeType === Node.ELEMENT_NODE && (next.tagName === "H2" || next.tagName === "HR")) {
                  break;
                }
                section.appendChild(next);
                index += 1;
              }
              fragment.appendChild(section);
              continue;
            }

            fragment.appendChild(node);
            index += 1;
          }

          container.appendChild(fragment);

          const headings = container.querySelectorAll("h2");
          headings.forEach((heading) => {
            const title = heading.textContent.trim().toLowerCase();
            if (title === "technical skills" || title === "interests") {
              const list = heading.nextElementSibling;
              if (list && list.tagName === "UL") {
                list.classList.add("resume-pill-list");
                list.querySelectorAll("li").forEach((item) => item.classList.add("skill-pill"));
              }
            }
          });

          const actionLinks = container.querySelectorAll(".resume-actions a");
          actionLinks.forEach((link) => {
            if (link.getAttribute("href")?.includes("resume.md")) {
              link.addEventListener("click", async (event) => {
                event.preventDefault();
                try {
                  const mdResponse = await fetch("./resume.md", { cache: "no-store" });
                  if (!mdResponse.ok) {
                    throw new Error(`Failed to load résumé (${mdResponse.status})`);
                  }
                  const mdContent = await mdResponse.text();
                  const pdfContainer = document.createElement("div");
                  pdfContainer.className = "resume-pdf";
                  pdfContainer.style.position = "absolute";
                  pdfContainer.style.left = "-9999px";
                  pdfContainer.innerHTML = marked.parse(mdContent);
                  
                  const pdfLinks = pdfContainer.querySelectorAll('a[href*="resume.md"]');
                  pdfLinks.forEach((link) => {
                    const listItem = link.closest("li");
                    if (listItem) {
                      listItem.remove();
                      return;
                    }
                    link.remove();
                  });
                  pdfContainer.querySelectorAll("ul").forEach((list) => {
                    if (!list.querySelector("li")) {
                      list.remove();
                    }
                  });

                  // Style header lines before first section
                  const firstSection = pdfContainer.querySelector('h2');
                  const introParagraphs = [];
                  let currentNode = pdfContainer.querySelector('p');
                  while (currentNode && currentNode !== firstSection) {
                    if (currentNode.tagName === 'P') {
                      introParagraphs.push(currentNode);
                    }
                    currentNode = currentNode.nextElementSibling;
                  }
                  introParagraphs.forEach((paragraph) => {
                    paragraph.className = 'contact-info';
                  });
                  
                  // Style job entries
                  const h3Elements = pdfContainer.querySelectorAll('h3');
                  h3Elements.forEach(h3 => {
                    h3.className = 'job-title';
                    const nextP = h3.nextElementSibling;
                    if (nextP && nextP.tagName === 'P' && nextP.innerHTML.includes('·')) {
                      nextP.className = 'job-details';
                    }
                  });
                  document.body.appendChild(pdfContainer);

                  const fullName = (pdfContainer.querySelector("h1")?.textContent || "Resume").trim();
                  
                  const canvas = await html2canvas(pdfContainer, {
                    scale: 1.6,
                    useCORS: true,
                    logging: false,
                    backgroundColor: "#ffffff",
                  });

                  const imgData = canvas.toDataURL("image/png");
                  const { jsPDF } = window.jspdf;
                  const pdf = new jsPDF({
                    orientation: "portrait",
                    unit: "in",
                    format: "letter",
                  });

                  const pageWidth = 8.5;
                  const pageHeight = 11;
                  const margin = 0.5;
                  const usableHeight = pageHeight - margin * 2;
                  const imgWidth = pageWidth - margin * 2;
                  const imgHeight = (canvas.height * imgWidth) / canvas.width;

                  const pagePixelHeight = (usableHeight / imgWidth) * canvas.width;
                  let yOffset = 0;

                  pdf.addImage(imgData, "PNG", margin, margin, imgWidth, imgHeight);
                  yOffset += pagePixelHeight;

                  while (yOffset < canvas.height) {
                    pdf.addPage();
                    const sourceY = yOffset;
                    const remainingHeight = canvas.height - yOffset;
                    const heightToUse = Math.min(remainingHeight, pagePixelHeight);
                    const croppedCanvas = document.createElement("canvas");
                    croppedCanvas.width = canvas.width;
                    croppedCanvas.height = heightToUse;
                    const ctx = croppedCanvas.getContext("2d");
                    ctx.drawImage(canvas, 0, sourceY, canvas.width, heightToUse, 0, 0, canvas.width, heightToUse);
                    const croppedImgData = croppedCanvas.toDataURL("image/png");
                    const croppedImgHeight = (heightToUse * imgWidth) / canvas.width;
                    pdf.addImage(croppedImgData, "PNG", margin, margin, imgWidth, croppedImgHeight);
                    yOffset += heightToUse;
                  }

                  pdf.save(`${fullName.replace(/\s+/g, "-")}-Resume.pdf`);
                  pdfContainer.remove();
                } catch (downloadError) {
                  console.error("PDF generation error:", downloadError);
                  alert("Unable to generate the PDF. Please try again.");
                }
              });
            }
          });
        } catch (error) {
          console.error(error);
          container.innerHTML = "<p class=\"text-red-400\">Unable to load résumé content.</p>";
        }
      });
    </script>
    <script src="../../navbar.js" defer></script>
    <script src="../../footer.js" defer></script>
    <script src="../../script.js" defer></script>
  </body>
</html>
