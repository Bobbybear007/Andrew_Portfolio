<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moved | Andrew Zambazos</title>
    <link rel="canonical" href="/work/">
    <script>
        var map = {
            'patriam-saga-of-roljar': 'patriam/',
            'star-in-the-wind': 'star-in-the-wind/',
            'garden-opencommonwealth': 'garden/'
        };
        var slug = '';
        try { slug = new URLSearchParams(window.location.search).get('slug') || ''; }
        catch (e) {
            var m = /[?&]slug=([^&]+)/.exec(window.location.search);
            slug = m ? decodeURIComponent(m[1]) : '';
        }
        window.location.replace(map[slug] || './');
    </script>
</head>
<body>
    <p style="font-family: sans-serif; padding: 2rem;">
        Case studies now live on their own pages.
        <a href="./">Back to all work</a>.
    </p>
</body>
