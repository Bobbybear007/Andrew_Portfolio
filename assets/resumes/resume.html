<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Résumé | Andrew Zambazos</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../style.css" />
    <style>
      @media print {
        #header, #particle-canvas, footer, .no-print { display: none !important; }
        main { padding-top: 0 !important; }
      }

      .resume-pdf {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: #ffffff;
        color: #0f172a;
        width: 7.5in;
        padding: 0.45in 0.5in;
        box-sizing: border-box;
      }

      .resume-pdf .resume-header {
        page-break-after: avoid;
        break-after: avoid;
      }
    </style>
  </head>
  <body class="antialiased">
    <canvas id="particle-canvas"></canvas>

    <header id="header" class="glass-effect fixed top-0 left-0 right-0 z-50 transition-all duration-300">
      <div class="container mx-auto px-6 py-4 flex justify-between items-center">
        <a href="#home" class="text-2xl font-bold tracking-wider">AZ</a>
        <nav class="hidden md:flex space-x-8 items-center">
          <a href="#about" class="hover:text-[#00D4FF] transition-colors duration-300">About</a>
          <a href="../../projects.html" class="hover:text-[#00D4FF] transition-colors duration-300">Projects</a>
          <a href="#resume" class="hover:text-[#00D4FF] transition-colors duration-300">Résumé</a>
          <a href="#contact" class="bg-violet-600 hover:bg-violet-500 text-white font-bold py-2 px-4 rounded-lg transition-colors duration-300">Contact</a>
        </nav>
        <button id="mobile-menu-button" class="md:hidden text-2xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
      <div id="mobile-menu" class="hidden md:hidden px-6 pb-4">
        <a href="#about" class="block py-2 hover:text-[#00D4FF]">About</a>
        <a href="../../projects.html" class="block py-2 hover:text-[#00D4FF]">Projects</a>
  <a href="#resume" class="block py-2 hover:text-[#00D4FF]">Résumé</a>
        <a href="#contact" class="block mt-2 text-center bg-violet-600 hover:bg-violet-500 text-white font-bold py-2 px-4 rounded-lg">Contact</a>
      </div>
    </header>

    <main class="pt-28 pb-16">
      <section id="resume" class="container mx-auto px-6">
        <div id="resume-content" class="space-y-6" aria-live="polite">
          <p class="text-gray-400">Loading résumé…</p>
        </div>
      </section>
    </main>

    <footer class="py-8 border-t border-gray-800">
      <div class="container mx-auto px-6 text-center text-gray-500">
        <p>&copy; 2025 Andrew Zambazos. All Rights Reserved.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      const addMarkdownSpacers = (markdown) => {
        const lines = markdown.split(/\r?\n/);
        const output = [];
        let blankRun = 0;

        const flushBlanks = () => {
          if (!blankRun) {
            return;
          }
          output.push("");
          for (let i = 1; i < blankRun; i += 1) {
            output.push('<div class="md-spacer"></div>');
            output.push("");
          }
          blankRun = 0;
        };

        lines.forEach((line) => {
          if (!line.trim()) {
            blankRun += 1;
            return;
          }
          flushBlanks();
          output.push(line);
        });

        flushBlanks();
        return output.join("\n");
      };

      const prepareMarkdownForPdf = (markdown) => {
        return markdown
          .replace(/\n{3,}/g, "\n\n")
          .replace(/<div class="md-spacer"><\/div>\n?/g, "")
          .trim();
      };

      const collectPdfBreakPoints = (container) => {
        const points = new Set([0]);

        container.querySelectorAll(".resume-section").forEach((section) => {
          const entries = section.querySelectorAll(":scope > h3");
          if (entries.length > 1) {
            entries.forEach((entry, index) => {
              if (index > 0) {
                points.add(entry.offsetTop);
              }
            });
            return;
          }

          const lists = section.querySelectorAll(":scope > ul");
          if (lists.length > 1) {
            lists.forEach((list, index) => {
              if (index > 0) {
                points.add(list.offsetTop);
              }
            });
            return;
          }

          points.add(section.offsetTop);
        });

        const footer = container.querySelector(".resume-footer");
        if (footer) {
          points.add(footer.offsetTop);
        }

        return Array.from(points).sort((a, b) => a - b);
      };

      const computePdfPageBreaks = (totalHeight, pageHeight, breakPoints, scale) => {
        const scaledPoints = breakPoints.map((point) => point * scale);
        const scaledTotal = totalHeight;
        const breaks = [0];
        let pageStart = 0;
        const minSegment = pageHeight * 0.35;

        while (pageStart + pageHeight < scaledTotal - 1) {
          const idealBreak = pageStart + pageHeight;
          const validPoints = scaledPoints.filter(
            (point) => point > pageStart + minSegment && point <= idealBreak
          );

          let nextBreak = validPoints.length ? Math.max(...validPoints) : idealBreak;

          if (nextBreak <= pageStart) {
            const overflowPoint = scaledPoints.find(
              (point) => point > idealBreak && point <= idealBreak + pageHeight * 0.15
            );
            nextBreak = overflowPoint || idealBreak;
          }

          if (nextBreak <= pageStart) {
            nextBreak = idealBreak;
          }

          breaks.push(nextBreak);
          pageStart = nextBreak;
        }

        return breaks;
      };

      const PDF_LAYOUT = {
        fontSize: 10,
        lineHeight: 1.45,
        paddingY: 0.45,
        paddingX: 0.5,
        h1: 18,
        h2: 11.5,
        h2Margin: 0.75,
        h3: 10.5,
        h3Margin: 0.55,
        contactMargin: 0.6,
        headerMargin: 0.5,
        jobMargin: 0.5,
        pMargin: 0.35,
        liMargin: 0.2,
        sectionSpacer: 0.5,
      };

      const applyPdfLayoutScale = (container, scale) => {
        container.style.fontSize = `${PDF_LAYOUT.fontSize * scale}pt`;
        container.style.lineHeight = String(PDF_LAYOUT.lineHeight * Math.min(scale + 0.05, 1.2));
        container.style.padding = `${PDF_LAYOUT.paddingY * scale}in ${PDF_LAYOUT.paddingX * scale}in`;
        container.querySelectorAll("h1").forEach((el) => {
          el.style.fontSize = `${PDF_LAYOUT.h1 * scale}pt`;
        });
        container.querySelectorAll("h2").forEach((el) => {
          el.style.fontSize = `${PDF_LAYOUT.h2 * scale}pt`;
          el.style.marginTop = `${PDF_LAYOUT.h2Margin * scale}rem`;
          el.style.marginBottom = `${0.35 * scale}rem`;
        });
        container.querySelectorAll("h3").forEach((el) => {
          el.style.fontSize = `${PDF_LAYOUT.h3 * scale}pt`;
          el.style.marginTop = `${PDF_LAYOUT.h3Margin * scale}rem`;
        });
        container.querySelectorAll("p").forEach((el) => {
          if (!el.classList.contains("contact-info")) {
            el.style.marginBottom = `${PDF_LAYOUT.pMargin * scale}rem`;
          }
        });
        container.querySelectorAll(".contact-info").forEach((el) => {
          el.style.marginBottom = `${PDF_LAYOUT.contactMargin * scale}rem`;
        });
        container.querySelectorAll(".resume-header").forEach((el) => {
          el.style.marginBottom = `${PDF_LAYOUT.headerMargin * scale}rem`;
        });
        container.querySelectorAll(".job-title").forEach((el) => {
          el.style.marginTop = `${PDF_LAYOUT.jobMargin * scale}rem`;
        });
        container.querySelectorAll("li").forEach((el) => {
          el.style.marginTop = `${PDF_LAYOUT.liMargin * scale}rem`;
          el.style.marginBottom = `${PDF_LAYOUT.liMargin * scale}rem`;
        });
        container.querySelectorAll(".qualification-spacer").forEach((el) => {
          el.style.height = `${PDF_LAYOUT.sectionSpacer * scale}rem`;
        });
      };

      const fitPdfToPages = async (container, { pdfScale, usableHeight, imgWidth, maxPages }) => {
        let layoutScale = 1;
        let canvas = await html2canvas(container, {
          scale: pdfScale,
          useCORS: true,
          logging: false,
          backgroundColor: "#ffffff",
        });

        const pagePixelHeight = (usableHeight / imgWidth) * canvas.width;
        const targetHeight = pagePixelHeight * maxPages;

        for (let attempt = 0; attempt < 6; attempt += 1) {
          const ratio = canvas.height / targetHeight;
          if (ratio > 1.025) {
            layoutScale *= 0.985 / ratio;
          } else if (ratio < 0.96) {
            layoutScale *= 0.985 / ratio;
          } else {
            break;
          }
          layoutScale = Math.max(0.82, Math.min(layoutScale, 1.15));
          applyPdfLayoutScale(container, layoutScale);
          canvas = await html2canvas(container, {
            scale: pdfScale,
            useCORS: true,
            logging: false,
            backgroundColor: "#ffffff",
          });
        }

        return canvas;
      };

      const buildResumeLayout = (container, { sectionClassName } = {}) => {
        const nodes = Array.from(container.childNodes).filter((node) => {
          if (node.nodeType === Node.TEXT_NODE) {
            return node.textContent.trim().length > 0;
          }
          return true;
        });

        container.innerHTML = "";
        const fragment = document.createDocumentFragment();
        let index = 0;

        const headerWrapper = document.createElement("div");
        headerWrapper.className = "resume-header";
        while (index < nodes.length) {
          const node = nodes[index];
          if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "H2") {
            break;
          }
          headerWrapper.appendChild(node);
          index += 1;
        }
        if (headerWrapper.childNodes.length) {
          fragment.appendChild(headerWrapper);
        }

        let footerHRIndex = -1;
        for (let i = nodes.length - 1; i >= 0; i--) {
          if (nodes[i].nodeType === Node.ELEMENT_NODE && nodes[i].tagName === "HR") {
            footerHRIndex = i;
            break;
          }
        }

        while (index < nodes.length) {
          const node = nodes[index];

          if (footerHRIndex !== -1 && index === footerHRIndex) {
            index += 1;
            const footerWrapper = document.createElement("div");
            footerWrapper.className = "resume-footer";
            while (index < nodes.length) {
              footerWrapper.appendChild(nodes[index]);
              index += 1;
            }
            const actionList = footerWrapper.querySelector("ul");
            if (actionList) {
              actionList.classList.add("resume-actions", "no-print");
            }
            if (footerWrapper.childNodes.length) {
              fragment.appendChild(footerWrapper);
            }
            break;
          }

          if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "H2") {
            const section = document.createElement("section");
            section.className = sectionClassName || "resume-section glass-effect rounded-2xl p-6 md:p-8 border border-gray-800";
            section.appendChild(node);
            index += 1;
            while (index < nodes.length) {
              const next = nodes[index];
              if (next.nodeType === Node.ELEMENT_NODE && next.tagName === "H2") {
                break;
              }
              if (footerHRIndex !== -1 && index === footerHRIndex) {
                break;
              }
              section.appendChild(next);
              index += 1;
            }
            fragment.appendChild(section);
            continue;
          }

          fragment.appendChild(node);
          index += 1;
        }

        container.appendChild(fragment);
      };

      const applyResumeEnhancements = (container, { forPdf = false } = {}) => {
        const headings = container.querySelectorAll("h2");
        headings.forEach((heading) => {
          const title = heading.textContent.trim().toLowerCase();
          if (!forPdf && (title === "technical skills" || title === "interests")) {
            const list = heading.nextElementSibling;
            if (list && list.tagName === "UL") {
              list.classList.add("resume-pill-list");
              list.querySelectorAll("li").forEach((item) => item.classList.add("skill-pill"));
            }
          }

          if (title === "education") {
            const section = heading.closest("section") || heading.parentElement;
            if (section) {
              section.querySelectorAll("hr").forEach((rule) => {
                const spacer = document.createElement("div");
                spacer.className = "qualification-spacer";
                rule.replaceWith(spacer);
              });
            }
          }
        });

        if (forPdf) {
          const pillLists = container.querySelectorAll(".resume-pill-list");
          pillLists.forEach((list) => {
            list.classList.remove("resume-pill-list");
          });
          const pillItems = container.querySelectorAll(".skill-pill");
          pillItems.forEach((item) => item.classList.remove("skill-pill"));
        }

        if (forPdf) {
          const firstSection = container.querySelector("h2");
          const introParagraphs = [];
          let currentNode = container.querySelector("p");
          while (currentNode && currentNode !== firstSection) {
            if (currentNode.tagName === "P") {
              introParagraphs.push(currentNode);
            }
            currentNode = currentNode.nextElementSibling;
          }
          introParagraphs.forEach((paragraph) => {
            paragraph.className = "contact-info";
          });

          const h3Elements = container.querySelectorAll("h3");
          h3Elements.forEach((h3) => {
            h3.className = "job-title";
            const nextEl = h3.nextElementSibling;
            if (nextEl && nextEl.tagName === "H4") {
              nextEl.className = "job-details";
            } else if (nextEl && nextEl.tagName === "P") {
              nextEl.className = "job-details";
            }
          });
        }
      };

      window.addEventListener("DOMContentLoaded", async () => {
        const container = document.getElementById("resume-content");
        try {
          const response = await fetch("./resume.md", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Failed to load résumé (${response.status})`);
          }
          const markdown = await response.text();
          const spacedMarkdown = addMarkdownSpacers(markdown);
          container.innerHTML = marked.parse(spacedMarkdown);
          buildResumeLayout(container);
          applyResumeEnhancements(container);

          const actionLinks = container.querySelectorAll(".resume-actions a");
          actionLinks.forEach((link) => {
            if (link.getAttribute("href")?.includes("resume.md")) {
              link.addEventListener("click", async (event) => {
                event.preventDefault();
                try {
                  const mdResponse = await fetch("./resume.md", { cache: "no-store" });
                  if (!mdResponse.ok) {
                    throw new Error(`Failed to load résumé (${mdResponse.status})`);
                  }
                  const mdContent = await mdResponse.text();
                  const pdfMarkdown = prepareMarkdownForPdf(mdContent);
                  const pdfContainer = document.createElement("div");
                  pdfContainer.className = "resume-pdf";
                  pdfContainer.style.position = "absolute";
                  pdfContainer.style.left = "-9999px";
                  pdfContainer.innerHTML = marked.parse(pdfMarkdown);
                  buildResumeLayout(pdfContainer, { sectionClassName: "resume-section" });
                  applyResumeEnhancements(pdfContainer, { forPdf: true });

                  const pdfLinks = pdfContainer.querySelectorAll('a[href*="resume.md"]');
                  pdfLinks.forEach((link) => {
                    const listItem = link.closest("li");
                    if (listItem) {
                      listItem.remove();
                      return;
                    }
                    link.remove();
                  });
                  pdfContainer.querySelectorAll("ul").forEach((list) => {
                    if (!list.querySelector("li")) {
                      list.remove();
                    }
                  });

                  document.body.appendChild(pdfContainer);

                  const fullName = (pdfContainer.querySelector("h1")?.textContent || "Resume").trim();
                  const pdfScale = 1.6;
                  const pageWidth = 8.5;
                  const pageHeight = 11;
                  const margin = 0.5;
                  const usableHeight = pageHeight - margin * 2;
                  const imgWidth = pageWidth - margin * 2;
                  const maxPages = 2;

                  const canvas = await fitPdfToPages(pdfContainer, {
                    pdfScale,
                    usableHeight,
                    imgWidth,
                    maxPages,
                  });

                  const resolvedPagePixelHeight = (usableHeight / imgWidth) * canvas.width;

                  const { jsPDF } = window.jspdf;
                  const pdf = new jsPDF({
                    orientation: "portrait",
                    unit: "in",
                    format: "letter",
                  });

                  const pageBreaks = computePdfPageBreaks(
                    canvas.height,
                    resolvedPagePixelHeight,
                    collectPdfBreakPoints(pdfContainer),
                    pdfScale
                  );

                  const sliceStarts = [...pageBreaks.filter((pos) => pos >= 0 && pos < canvas.height)];
                  if (sliceStarts[sliceStarts.length - 1] !== canvas.height) {
                    sliceStarts.push(canvas.height);
                  }

                  if (sliceStarts.length - 1 > maxPages) {
                    sliceStarts.length = 0;
                    sliceStarts.push(0, canvas.height / maxPages, canvas.height);
                  }

                  let pageIndex = 0;
                  for (let i = 0; i < sliceStarts.length - 1; i += 1) {
                    const start = sliceStarts[i];
                    const end = sliceStarts[i + 1];
                    const heightToUse = end - start;
                    const croppedCanvas = document.createElement("canvas");
                    croppedCanvas.width = canvas.width;
                    croppedCanvas.height = heightToUse;
                    const ctx = croppedCanvas.getContext("2d");
                    ctx.drawImage(canvas, 0, start, canvas.width, heightToUse, 0, 0, canvas.width, heightToUse);
                    const croppedImgData = croppedCanvas.toDataURL("image/png");
                    const croppedImgHeight = (heightToUse * imgWidth) / canvas.width;
                    if (pageIndex > 0) {
                      pdf.addPage();
                    }
                    pdf.addImage(croppedImgData, "PNG", margin, margin, imgWidth, croppedImgHeight);
                    pageIndex += 1;
                  }

                  pdf.save(`${fullName.replace(/\s+/g, "-")}-Resume.pdf`);
                  pdfContainer.remove();
                } catch (downloadError) {
                  console.error("PDF generation error:", downloadError);
                  alert("Unable to generate the PDF. Please try again.");
                }
              });
            }
          });
        } catch (error) {
          console.error(error);
          container.innerHTML = "<p class=\"text-red-400\">Unable to load résumé content.</p>";
        }
      });
    </script>
    <script src="../../navbar.js" defer></script>
    <script src="../../footer.js" defer></script>
    <script src="../../script.js" defer></script>
  </body>
</html>
